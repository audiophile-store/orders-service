services:
  app:
    build:
      context: .
    image: audiophile-orders:local
    environment:
      NODE_ENV: production
      PORT: "3001"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
      PRODUCTS_SERVICE_URL: ${DOCKER_PRODUCTS_SERVICE_URL:?Set DOCKER_PRODUCTS_SERVICE_URL in .env}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/001_create_test_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orders_data:
